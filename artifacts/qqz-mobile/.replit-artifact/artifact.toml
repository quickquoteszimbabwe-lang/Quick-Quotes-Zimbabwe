kind = "mobile"
previewPath = "/mobile/"
title = "Quick Quotes Zimbabwe Mobile"
version = "1.0.0"
id = "artifacts/qqz-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 23006

[services.development]
run = "pnpm --filter @workspace/qqz-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qqz-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/qqz-mobile", "run", "serve" ]

[services.env]
PORT = "23006"
BASE_PATH = "/mobile/"
