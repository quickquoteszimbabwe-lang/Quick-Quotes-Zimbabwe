openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Quick Quotes Zimbabwe API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: jobs
    description: Job requests
  - name: quotes
    description: Quotes on jobs
  - name: payments
    description: Payment records
  - name: reviews
    description: Reviews and ratings
  - name: admin
    description: Admin panel
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/profile:
    get:
      operationId: getProfile
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

    patch:
      operationId: updateProfile
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/professional:
    get:
      operationId: getProfessionalProfile
      tags: [users]
      summary: Get professional profile for current user
      responses:
        "200":
          description: Professional profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createProfessionalProfile
      tags: [users]
      summary: Create professional profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfessionalRequest"
      responses:
        "201":
          description: Professional profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"

    patch:
      operationId: updateProfessionalProfile
      tags: [users]
      summary: Update professional profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfessionalRequest"
      responses:
        "200":
          description: Updated professional profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"

  /jobs:
    get:
      operationId: getJobs
      tags: [jobs]
      summary: List jobs (filtered by role)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new job request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a single job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobRequest"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/select-quote:
    post:
      operationId: selectQuote
      tags: [jobs]
      summary: Customer selects a quote for their job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectQuoteRequest"
      responses:
        "200":
          description: Quote selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/complete:
    post:
      operationId: completeJob
      tags: [jobs]
      summary: Customer approves job completion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /quotes:
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Professional submits a quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: Quote submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/my:
    get:
      operationId: getMyQuotes
      tags: [quotes]
      summary: Get quotes submitted by current professional
      responses:
        "200":
          description: My quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"

  /payments:
    get:
      operationId: getPayments
      tags: [payments]
      summary: List payments for current user
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a payment record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/status:
    patch:
      operationId: updatePaymentStatus
      tags: [payments]
      summary: Update payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentStatusRequest"
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Customer submits a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/professional/{professionalId}:
    get:
      operationId: getProfessionalReviews
      tags: [reviews]
      summary: Get reviews for a professional
      parameters:
        - name: professionalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /admin/users:
    get:
      operationId: adminGetUsers
      tags: [admin]
      summary: Admin - list all users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}/suspend:
    post:
      operationId: adminSuspendUser
      tags: [admin]
      summary: Admin - suspend a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/professionals/{id}/approve:
    post:
      operationId: adminApproveProfessional
      tags: [admin]
      summary: Admin - approve a professional
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Professional approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"

  /admin/jobs:
    get:
      operationId: adminGetJobs
      tags: [admin]
      summary: Admin - list all jobs
      responses:
        "200":
          description: All jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /admin/payments:
    get:
      operationId: adminGetPayments
      tags: [admin]
      summary: Admin - list all payments
      responses:
        "200":
          description: All payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /categories:
    get:
      operationId: getCategories
      tags: [services]
      summary: List active categories
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /categories/tree:
    get:
      operationId: getCategoryTree
      tags: [services]
      summary: Get full category/subcategory/service tree
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryTreeNode"

  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: Search/list services
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: subcategoryId
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /admin/categories:
    get:
      operationId: adminGetCategories
      tags: [admin]
      summary: Admin - list all categories
      responses:
        "200":
          description: All categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: adminCreateCategory
      tags: [admin]
      summary: Admin - create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /admin/categories/{id}:
    patch:
      operationId: adminUpdateCategory
      tags: [admin]
      summary: Admin - update category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: adminDeleteCategory
      tags: [admin]
      summary: Admin - delete category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/subcategories:
    get:
      operationId: adminGetSubcategories
      tags: [admin]
      summary: Admin - list all subcategories
      responses:
        "200":
          description: All subcategories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcategory"
    post:
      operationId: adminCreateSubcategory
      tags: [admin]
      summary: Admin - create subcategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubcategoryRequest"
      responses:
        "201":
          description: Created subcategory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subcategory"

  /admin/subcategories/{id}:
    patch:
      operationId: adminUpdateSubcategory
      tags: [admin]
      summary: Admin - update subcategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubcategoryRequest"
      responses:
        "200":
          description: Updated subcategory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subcategory"
    delete:
      operationId: adminDeleteSubcategory
      tags: [admin]
      summary: Admin - delete subcategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/services:
    get:
      operationId: adminGetServices
      tags: [admin]
      summary: Admin - list all services
      responses:
        "200":
          description: All services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: adminCreateService
      tags: [admin]
      summary: Admin - create service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /admin/services/{id}:
    patch:
      operationId: adminUpdateService
      tags: [admin]
      summary: Admin - update service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: adminDeleteService
      tags: [admin]
      summary: Admin - delete service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [customer, professional, admin]
        suspended:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - role
        - suspended
        - createdAt

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
        suspended:
          type: boolean
        createdAt:
          type: string
        professional:
          $ref: "#/components/schemas/Professional"
      required:
        - id
        - name
        - email
        - role
        - suspended
        - createdAt

    Professional:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        services:
          type: array
          items:
            type: string
        rating:
          type: ["number", "null"]
        verified:
          type: boolean
        completedJobs:
          type: integer
        bio:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        experience:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
      required:
        - id
        - userId
        - services
        - verified
        - completedJobs

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        password:
          type: string
        role:
          type: string
          enum: [customer, professional]
      required:
        - name
        - email
        - password
        - role

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: ["string", "null"]

    CreateProfessionalRequest:
      type: object
      properties:
        services:
          type: array
          items:
            type: string
        bio:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        experience:
          type: ["string", "null"]
      required:
        - services

    UpdateProfessionalRequest:
      type: object
      properties:
        services:
          type: array
          items:
            type: string
        bio:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        experience:
          type: ["string", "null"]

    Job:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        category:
          type: string
        service:
          type: string
        description:
          type: string
        location:
          type: string
        timeline:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_progress, completed, cancelled]
        selectedProfessionalId:
          type: ["integer", "null"]
        createdAt:
          type: string
        customerName:
          type: ["string", "null"]
        photos:
          type: array
          items:
            type: string
      required:
        - id
        - customerId
        - category
        - service
        - description
        - location
        - status
        - createdAt

    JobDetail:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        category:
          type: string
        service:
          type: string
        description:
          type: string
        location:
          type: string
        timeline:
          type: ["string", "null"]
        status:
          type: string
        selectedProfessionalId:
          type: ["integer", "null"]
        createdAt:
          type: string
        customerName:
          type: ["string", "null"]
        photos:
          type: array
          items:
            type: string
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/QuoteDetail"
        payment:
          $ref: "#/components/schemas/Payment"
        review:
          $ref: "#/components/schemas/Review"
      required:
        - id
        - customerId
        - category
        - service
        - description
        - location
        - status
        - createdAt
        - quotes

    CreateJobRequest:
      type: object
      properties:
        category:
          type: string
        service:
          type: string
        description:
          type: string
        location:
          type: string
        timeline:
          type: ["string", "null"]
        photos:
          type: array
          items:
            type: string
      required:
        - category
        - service
        - description
        - location

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
        active:
          type: boolean
        featured:
          type: boolean
        sortOrder:
          type: integer
      required:
        - id
        - name
        - icon
        - active
        - featured
        - sortOrder

    Subcategory:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        name:
          type: string
        active:
          type: boolean
        sortOrder:
          type: integer
      required:
        - id
        - categoryId
        - name
        - active
        - sortOrder

    Service:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: string
        categoryId:
          type: integer
        subcategoryId:
          type: ["integer", "null"]
        active:
          type: boolean
        featured:
          type: boolean
        sortOrder:
          type: integer
      required:
        - id
        - name
        - icon
        - categoryId
        - active
        - featured
        - sortOrder

    SubcategoryWithServices:
      allOf:
        - $ref: "#/components/schemas/Subcategory"
        - type: object
          properties:
            services:
              type: array
              items:
                $ref: "#/components/schemas/Service"
          required:
            - services

    CategoryTreeNode:
      allOf:
        - $ref: "#/components/schemas/Category"
